syntax = "proto3";

package glfs;

// These are the RPC server and client entry points, along with the message
// type they send and return. Note that each entry point must take *exactly*
// one input and return *exactly* one output. Define empty message types if
// you need no call and/or return values.
service glfs {
    rpc lookup(lookupRequest) returns (lookupResponse) {}
    rpc stat(statRequest) returns (statResponse) {}
    // Define the remainder here
}

message lookupRequest {
    int32 pinum = 1;
    string name = 2;
}

message lookupResponse {
    int32 inum = 1;
}

message statRequest {
    int32 inum = 1;
}

message statResponse {
    int32 success = 1;
    int32 type = 2;
    int32 size = 3;
}

// Define messages for additional RPC service calls you need. Again, each
// RPC service takes exactly one argument message and returns exactly one
// return message. So any call with multiple input or output arguments will 
// need multiple entries in its message. The numbers next to the fields are
// the unique field numbers used by GRPC in that message. Pick unique ones,
// generally in the 1-15 range. They do not need to be unique between
// messages
